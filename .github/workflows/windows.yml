# Builds a Windows x64 secondreality.exe and publishes it as this run's artifact (no Release).
# SDL2 is linked from the official SDL2 Windows development package, pinned by version and
# SHA-256, and its SDL2.dll ships beside the executable with assets\, which the binary reads
# relative to the folder it is started in.
name: Windows build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'reference/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SDL2_VERSION: 2.32.10
      SDL2_SHA256: af347939395a58b365846aaea27391e69f9ec9d4dd650d6ac40802159b418a6e
    steps:
      # The build reads only assets/ and the crates; upstream/ (the submodule) is for tests.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the SDL2 development package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "SDL2-devel-$env:SDL2_VERSION-VC.zip"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SDL2_SHA256) { throw "SDL2 package SHA-256 is $hash, expected $env:SDL2_SHA256" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sdl2')
          $sdl = Join-Path $env:RUNNER_TEMP "sdl2\SDL2-$env:SDL2_VERSION"
          # sdl2-sys emits `-l SDL2` and no search path; the linker finds SDL2.lib here.
          "SDL2_DIR=$sdl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTFLAGS=-L native=$sdl\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # .gitattributes keeps assets/ byte-exact; this proves the checkout did.
      - name: Verify the assets against PROVENANCE.md
        run: cargo xtask assets verify --tree

      - name: Build
        run: cargo build --release --locked -p secondreality

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist\SecondReality'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\secondreality.exe $out
          Copy-Item (Join-Path $env:SDL2_DIR 'lib\x64\SDL2.dll') $out
          Copy-Item (Join-Path $env:SDL2_DIR 'LICENSE.txt') (Join-Path $out 'SDL2-LICENSE.txt')
          Copy-Item -Recurse assets (Join-Path $out 'assets')
          Copy-Item README.md, LICENSE, tools\windows\README-WINDOWS.txt $out

      # The packaged exe loads SDL2.dll and reads its assets from its own folder: two frames of
      # a headless block-1 run, dumped outside the package.
      - name: Smoke-test the package
        shell: pwsh
        working-directory: dist\SecondReality
        run: |
          $dump = Join-Path $env:RUNNER_TEMP 'smoke'
          .\secondreality.exe --headless --block 1 --dump-frames 500,1300 --dump-dir $dump
          if ($LASTEXITCODE -ne 0) { throw "secondreality.exe exited $LASTEXITCODE" }
          foreach ($f in 'alku_000500.idx', 'alku_001300.idx') {
            if (-not (Test-Path (Join-Path $dump $f))) { throw "the smoke run wrote no $f" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: secondreality-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
