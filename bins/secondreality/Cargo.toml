[package]
name = "secondreality"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "secondreality"
path = "src/main.rs"

[dependencies]
sr-engine.workspace = true
# The run's music, and the player the engine's `Music` seam is adapted from. The
# adapter itself is this binary's (`src/audio.rs`): neither crate can name the other's
# types, and the binary is the only crate that depends on both.
sr-audio.workspace = true
# A part reads its media in the original's format, through the port's own
# decoders: BEGLOGO's picture is an Origin RLE PIC, and nothing in this tree
# pre-converts it.
sr-assets = { path = "../../crates/sr-assets" }
# The window is the binary's business; sr-engine keeps zero runtime deps.
sdl2.workspace = true
serde.workspace = true
serde_json.workspace = true
# The embedded assets are one raw LZMA stream (build.rs); this unpacks it at startup. Pure Rust
# and, with the defaults off, no dependencies of its own.
lzma-rust2 = { version = "=0.24.0", default-features = false, features = ["std"] }

[build-dependencies]
# The same crate's encoder, run over assets/ by build.rs. Single-threaded, so its output is the
# same on every build.
lzma-rust2 = { version = "=0.24.0", default-features = false, features = ["std", "encoder"] }
