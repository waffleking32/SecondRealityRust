[package]
name = "secondreality"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "secondreality"
path = "src/main.rs"

[dependencies]
sr-engine.workspace = true
# The window is the binary's business; sr-engine keeps zero runtime deps.
# sdl2's default feature set is empty, so this links the system SDL2 rather
# than vendoring and compiling one.
sdl2.workspace = true
serde.workspace = true
serde_json.workspace = true
