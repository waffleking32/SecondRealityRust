[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only ever speaks http to 127.0.0.1:8386, so no TLS: dropping the default
# features keeps rustls and ring out of the tree entirely.
ureq = { version = "2", default-features = false, features = ["json"] }
# `compare` writes one diff image per frame, and `frames sheet` and the `--sheet`
# options write contact sheets; the tests decode them back.
png = "0.17"
# `assets verify` reads the curated tree with the port's own decoders, so a
# format the port cannot read fails this check here as well as in a part.
sr-assets = { path = "../crates/sr-assets" }
# For the 6→8 widening the engine defines (`dac_expand`): a sheet shows a
# picture through its palette, and re-deriving that rule here is how the
# widening would come to differ between the tool and the demo.
sr-engine = { workspace = true }
# For the two songs' shared row (`sr_audio::SONGS`): the module paths and the
# tempo the shell patches are one fact, and `music analyse` reads the same copy
# the run applies rather than a second table.
sr-audio = { path = "../crates/sr-audio" }
# `--tree` re-hashes every asset and compares it with `assets/PROVENANCE.md`,
# whose digests are `sha256sum`'s. The standard implementation, so the tool and
# the command the record was measured with cannot disagree.
sha2 = "0.10"
