[workspace]
resolver = "2"
members = ["bins/secondreality", "crates/sr-engine", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sr-engine = { path = "crates/sr-engine" }
sdl2 = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
