[workspace]
resolver = "2"
members = [
    "bins/secondreality",
    "crates/sr-assets",
    "crates/sr-audio",
    "crates/sr-engine",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sr-audio = { path = "crates/sr-audio" }
sr-engine = { path = "crates/sr-engine" }
# SDL 2 is compiled from the source sdl2-sys ships and linked into the binary, on every OS.
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The mixer's tests run the player for minutes of music — `tests/enhanced.rs`'s 30,000-poll
# clock pin (D43) above all — and the mixer is integer arithmetic whose result does not depend
# on the optimiser. Optimising this one package in the dev and test profiles keeps those pins in
# every profile without a minute-long debug run; overflow checks and debug assertions stay on,
# because only `opt-level` is overridden.
[profile.dev.package.sr-audio]
opt-level = 3

# build.rs compresses assets/ with this crate on every asset change, and the dependencies of build
# scripts compile unoptimised by default: optimised, the encode takes 1.6 s instead of 8.7 (the same
# bytes). The override reaches the run-time decoder too (in dist, 1.6 KB over "s").
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.release.package.lzma-rust2]
opt-level = 3

# The packaged build (`cargo build --profile dist`, what CI ships): the release profile tuned for
# size. Measured on the whole binary, "s" with fat LTO is the smallest ("z" is larger and slower,
# thin LTO larger) and runs a frame in about 0.2 ms of the 14.3 ms a 70 Hz tick allows; opt 3
# would cost about 220 KB. `release`, otherwise cargo's default and fast to build, is for tests
# and rediff.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
